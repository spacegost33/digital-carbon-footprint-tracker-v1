{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><div class="auth-card glass-3d"><div class="brand-mark large">C</div><div class="eyebrow">CARBONTRACK ACCOUNT</div><h2>{{ mode }}</h2><p class="muted">Your digital sustainability workspace.</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if mode=='Create account' %}<label>Full name<input name="name" required maxlength="100" autocomplete="name"></label>{% endif %}<label>Email address<input name="email" type="email" required maxlength="180" autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="10" maxlength="128" autocomplete="{% if mode=='Sign in' %}current-password{% else %}new-password{% endif %}"></label><button class="btn primary full">{{ mode }} <span>↗</span></button></form><p class="muted center">{% if mode=='Sign in' %}New here? <a href="{{ url_for('web.register') }}">Create an account</a>{% else %}Already registered? <a href="{{ url_for('web.login') }}">Sign in</a>{% endif %}</p></div></div>{% endblock %}
